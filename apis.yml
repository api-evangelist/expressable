aid: expressable
name: Expressable
description: 'Expressable is an online speech therapy platform based in Austin, Texas
  that connects children and adults with licensed speech-language pathologists for
  one-on-one virtual teletherapy sessions across the United States. Founded by speech-language
  pathologist Leanne Sherred, the company treats speech delays, stuttering, apraxia,
  aphasia, dysarthria, autism-related communication challenges, voice and swallowing
  disorders, accent modification and gender-affirming voice training through a client
  portal at app.expressable.com, and works with both insurance plans and private pay.
  Expressable is a direct-to-consumer and payer-facing healthcare services company:
  it publishes an llms.txt for AI agents but no public developer program, API reference,
  or machine-readable API contract.'
